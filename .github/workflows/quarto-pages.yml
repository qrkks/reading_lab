name: Render Quarto books

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  render:
    permissions:
      actions: write
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.3"

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::knitr
            any::rmarkdown
            any::UsingR
          dependencies: '"hard"'
          install-quarto: false

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.12.6"

      - name: Cache Julia dependencies
        uses: julia-actions/cache@v3

      - name: Install Julia dependencies
        shell: bash
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python dependencies
        shell: bash
        run: |
          uv sync --locked
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Render books
        shell: bash
        run: |
          set -euo pipefail

          slug_for() {
            case "$1" in
              "《概率论与数理统计》教学视频2.0版本【宋浩老师】")
                echo "songhao-probability-statistics"
                ;;
              "数理统计学导论（Hogg）")
                echo "hogg-introduction-mathematical-statistics"
                ;;
              "概率论与数理统计（浙大版）")
                echo "zheda-probability-statistics"
                ;;
              "概率论与统计推断（Hogg）")
                echo "hogg-probability-statistical-inference"
                ;;
              "统计推断（Casella）")
                echo "casella-statistical-inference"
                ;;
              "高等数学第8版（同济大学数学科学学院）")
                echo "tongji-advanced-mathematics"
                ;;
              *)
                echo "$1"
                ;;
            esac
          }

          mkdir -p public
          touch public/.nojekyll
          book_index="$(mktemp)"
          trap 'rm -f "$book_index"' EXIT

          find books -type f -path '*/book/_quarto.yml' -print0 |
            sort -z |
            while IFS= read -r -d '' config; do
              book_dir="$(dirname "$config")"
              book_title="$(basename "$(dirname "$book_dir")")"
              # book_slug="$(slug_for "$book_title")"
              book_slug="$book_title"
              render_dir="$(mktemp -d)"

              # Preserve the repository layout in the temporary render tree so
              # paths such as ../../assets/main-header.html remain valid.
              temp_book_dir="$render_dir/$book_dir"
              mkdir -p "$(dirname "$temp_book_dir")"
              cp -a "$book_dir" "$temp_book_dir"
              if [[ -d books/assets ]]; then
                mkdir -p "$render_dir/books"
                cp -a books/assets "$render_dir/books/assets"
              fi
              # Julia notebook workers start with --project=@. and search
              # upward from each QMD file inside the temporary render tree.
              cp Project.toml Manifest.toml "$render_dir/"
              # PythonCall's @venv resolves from the active Julia project.
              # Reuse the uv-managed environment instead of copying it.
              ln -s "$GITHUB_WORKSPACE/.venv" "$render_dir/.venv"
              html_metadata="$render_dir/_metadata.yml"
              cp _quarto-html.yml "$html_metadata"
              book_number_depth="$(awk '/^number-depth:[[:space:]]*/ { print $2; exit }' "$config")"
              if [[ -n "$book_number_depth" ]]; then
                sed -i -E "s/^    number-depth: .*/    number-depth: $book_number_depth/" "$html_metadata"
              fi
              while IFS= read -r -d '' doc; do
                cp "$html_metadata" "$(dirname "$doc")/_metadata.yml"
              done < <(find "$temp_book_dir" -type f \( -name '*.qmd' -o -name '*.md' \) -print0)
              quarto render "$temp_book_dir" --to html

              mkdir -p "public/$book_slug"
              rsync -a --delete "$temp_book_dir/_book/" "public/$book_slug/"
              printf '%s\0%s\0' "${book_dir#books/}" "$book_slug" >> "$book_index"
              rm -rf "$render_dir"
            done

          python scripts/build_book_index.py --manifest "$book_index" --output public/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: render
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
